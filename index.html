<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paws & Preferences</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- Landing Page -->
    <div id="landing">
        <h1>Paws & Preferences</h1>
        <p>Find your favourite kitty by swiping!</p>

        <button id="startBtn">Start</button>
        <button id="clearBtn" class="clear">Clear Likes</button>

        <h2>Your Liked Cats</h2>
        <div id="likedContainer"></div>
    </div>

    <!-- Swipe Page -->
    <div id="swipePage" class="hidden">
        <p id="progress">Cat 1 of 20</p>

        <div id="cardContainer">
            <img id="catCard" src="" alt="Cat" />
        </div>

        <!-- Floating Buttons -->
        <div class="buttons">
            <button id="dislikeBtn" class="round red">✖</button>
            <button id="likeBtn" class="round green">❤</button>
        </div>
    </div>

    <!-- Sound Effects -->
    <audio id="likeSound" src="like.mp3"></audio>
    <audio id="dislikeSound" src="dislike.mp3"></audio>

    <script src="script.js"></script>
</body>
</html>
