<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paws & Preferences</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff6b9a">

    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <div id="spinner" class="spinner hidden"></div>

    <header>
        <h1>Paws & Preferences</h1>
    </header>

    <main>
        <div class="card-area">
            <div id="card-container"></div>
        </div>

        <div class="controls">
            <button id="undo" class="control-btn undo">↩️</button>
            <button id="dislike" class="control-btn dislike">❌</button>
            <button id="like" class="control-btn like">❤️</button>
        </div>
    </main>

    <div id="summary" class="hidden summary-page">
        <h2>You liked <span id="liked-count"></span> cats!</h2>
        <div id="liked-gallery"></div>

        <button id="restart" class="restart-btn">Restart</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
